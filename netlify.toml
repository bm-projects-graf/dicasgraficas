[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# O site tem de viver num só domínio. Sem isto, o dicasgraficas.netlify.app
# serve uma cópia integral do site e o Google vê conteúdo duplicado.
[[redirects]]
  from = "https://dicasgraficas.netlify.app/*"
  to = "https://dicasgraficas.com/:splat"
  status = 301
  force = true

# Cabeçalhos de segurança e performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache para ativos estáticos
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
